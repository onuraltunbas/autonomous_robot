slam_toolbox:
  ros__parameters:
    # Frame Parametreleri
    odom_frame: odom
    map_frame: map
    base_frame: base_link
    scan_topic: /scan
    use_map_saver: true
    mode: mapping # mapping veya localization

    # Lazer / Sonar Parametreleri (HC-SR04 Uyumlu)
    max_laser_range: 4.0
    min_laser_range: 0.02
    resolution: 0.05
    minimum_time_interval: 0.05
    transform_timeout: 0.2
    tf_buffer_duration: 30.0
    stack_size_to_use: 40000000

    # Tarama ve Eşleme Eşikleri
    minimum_travel_distance: 0.05
    minimum_travel_heading: 0.05
    scan_buffer_size: 10
    scan_buffer_maximum_scan_distance: 4.0
    link_match_minimum_response_fine: 0.1
    link_scan_maximum_distance: 1.5
    loop_search_maximum_distance: 3.0
    do_loop_closing: true
    loop_match_minimum_chain_size: 10
    loop_match_maximum_variance_coarse: 3.0
    loop_match_minimum_response_coarse: 0.35
    loop_match_minimum_response_fine: 0.45

    # Harita Boyutları ve Güncelleme
    map_file_name: house_map
    map_start_pose: [0.0, 0.0, 0.0]
    map_start_at_dock: true
